name: Build Dawrat Al-Nawm APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: unzip -o Dawrat_AlNawm_Android_APK_Project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk دورات-النوم.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dawrat-AlNawm-APK
          path: دورات-النوم.apk
